name: CSI Project DevSecOps

on:
  push:
    branches:
      - dev
      - main
      - "feature/**"

  pull_request:
    branches:
      - dev
      - main

jobs:
  backend:
    name: Backend Tests & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pip-audit

      - name: Run backend tests
        run: |
          python -m pytest backend/tests -v

      - name: Scan Python dependencies
        run: |
          pip-audit -r backend/requirements.txt


  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend security audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  security-gate:
    name: DevSecOps Security Gate
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - secret-scan

    steps:
      - name: All security checks passed
        run: |
          echo "======================================"
          echo " CSI PROJECT DEVSECOPS PIPELINE PASSED "
          echo "======================================"
          echo "Backend tests: PASSED"
          echo "Python dependency scan: PASSED"
          echo "Frontend lint: PASSED"
          echo "Frontend security audit: PASSED"
          echo "Frontend build: PASSED"
          echo "Secret scan: PASSED"
          echo "All security gates passed."